# Production stack for Dokploy.
# Postgres — ОТДЕЛЬНЫЙ сервис в Dokploy (не в этом compose), чтобы к БД
# можно было ходить независимо от приложения.
#
# DATABASE_URL — Internal Connection URL из Dokploy Databases, например:
# postgresql://portal-admin:PASSWORD@b2b-portal-hblrpr:5432/portal
#
# Чтобы хост БД резолвился, все сервисы должны быть в dokploy-network
# (там же живут Databases Dokploy).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      PORT: 4000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@avgst.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-AVGST Admin}
      # Опциональный seed-партнёр при первом старте
      PARTNER_EMAIL: ${PARTNER_EMAIL:-partner@avgst.local}
      PARTNER_PASSWORD: ${PARTNER_PASSWORD:-ChangeMe123!}
      PARTNER_FULL_NAME: ${PARTNER_FULL_NAME:-Демо Партнёр}
      PARTNER_COMPANY_NAME: ${PARTNER_COMPANY_NAME:-Демо Дилер}
      PARTNER_REGION: ${PARTNER_REGION:-Нижний Новгород}
      TILDA_PUBLIC_KEY: ${TILDA_PUBLIC_KEY:-}
      TILDA_SECRET_KEY: ${TILDA_SECRET_KEY:-}
      TILDA_API_BASE: ${TILDA_API_BASE:-https://store.tildaapi.com/api/getproductslist/}
      TILDA_MODULAR_STOREPARTUID: ${TILDA_MODULAR_STOREPARTUID:-}
      TILDA_MODULAR_RECID: ${TILDA_MODULAR_RECID:-}
      TILDA_PANEL_STOREPARTUID: ${TILDA_PANEL_STOREPARTUID:-}
      TILDA_PANEL_RECID: ${TILDA_PANEL_RECID:-}
      TILDA_SITE_BASE_URL: ${TILDA_SITE_BASE_URL:-https://avgst.ru}
      # Снимки профилей соцсетей
      SOCIAL_PROFILE_TTL_MINUTES: ${SOCIAL_PROFILE_TTL_MINUTES:-20}
      INSTAGRAM_PROVIDER: ${INSTAGRAM_PROVIDER:-auto}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_IG_BUSINESS_ID: ${META_IG_BUSINESS_ID:-}
      # Пусто → стадия коллектора пропускается. Включая профиль instagram,
      # задай http://instagram-collector:4100
      INSTAGRAM_COLLECTOR_URL: ${INSTAGRAM_COLLECTOR_URL:-}
      INSTAGRAM_COLLECTOR_TOKEN: ${INSTAGRAM_COLLECTOR_TOKEN:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://b2b.avgst.ru}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-AVGST <noreply@avgst.ru>}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Имя сервиса = то, что указано в Dokploy Domains (сейчас: portal)
  portal:
    build:
      context: .
      dockerfile: apps/portal-web/Dockerfile
      args:
        # Rewrites в next.config запекаются на билде — не localhost
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://b2b.avgst.ru}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - dokploy-network
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://b2b.avgst.ru}
      PORT: "3410"
    expose:
      - "3410"

  site-runtime:
    build:
      context: .
      dockerfile: apps/site-runtime/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://b2b.avgst.ru}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - dokploy-network
    environment:
      APP_ROLE: site
      NEXT_PUBLIC_APP_ROLE: site
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://b2b.avgst.ru}
      PORT: "3410"
    expose:
      - "3410"

  # Браузерный сборщик Instagram: отдельный контейнер с Chromium.
  # Наружу не публикуется — только внутренняя сеть и общий токен с API.
  #
  # По умолчанию НЕ поднимается: из РФ www.instagram.com недоступен, без
  # COLLECTOR_PROXY_URL сбор всегда даёт unavailable, а образ Playwright весит
  # около 2 ГБ. Чтобы включить, задай в окружении Dokploy:
  #   COMPOSE_PROFILES=instagram
  #   INSTAGRAM_COLLECTOR_TOKEN=<общий секрет с API>
  #   INSTAGRAM_COLLECTOR_URL=http://instagram-collector:4100
  #   COLLECTOR_PROXY_URL=<исходящий прокси>
  # Токен здесь без :? — иначе Compose падает на интерполяции даже когда
  # профиль выключен. Пустой токен отсекает сам коллектор на старте.
  instagram-collector:
    profiles: ["instagram"]
    build:
      context: .
      dockerfile: apps/instagram-collector/Dockerfile
    restart: unless-stopped
    networks:
      - default
    environment:
      INSTAGRAM_COLLECTOR_TOKEN: ${INSTAGRAM_COLLECTOR_TOKEN:-}
      COLLECTOR_PORT: 4100
      COLLECTOR_CONCURRENCY: ${COLLECTOR_CONCURRENCY:-1}
      COLLECTOR_TRACE_TTL_MINUTES: ${COLLECTOR_TRACE_TTL_MINUTES:-60}
      # storageState служебного аккаунта монтируется как secret, в образ не кладётся
      COLLECTOR_STORAGE_STATE: ${COLLECTOR_STORAGE_STATE:-}
      # Обязателен, если сервер стоит в РФ: instagram.com оттуда недоступен
      COLLECTOR_PROXY_URL: ${COLLECTOR_PROXY_URL:-}
      COLLECTOR_PROXY_USERNAME: ${COLLECTOR_PROXY_USERNAME:-}
      COLLECTOR_PROXY_PASSWORD: ${COLLECTOR_PROXY_PASSWORD:-}
    expose:
      - "4100"
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  # Общая сеть Dokploy: сюда подключены Databases → резолвится b2b-portal-hblrpr
  dokploy-network:
    external: true
