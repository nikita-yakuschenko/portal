<script>
  (function () {
    function hideChrome() {
      var records = document.querySelectorAll("#allrecords > .t-rec");
      for (var i = 0; i < records.length; i++) {
        if (!records[i].querySelector(".avgst-moved")) {
          records[i].style.setProperty("display", "none", "important");
          records[i].style.setProperty("visibility", "hidden", "important");
          records[i].style.setProperty("height", "0", "important");
          records[i].style.setProperty("overflow", "hidden", "important");
        }
      }
      var extras = document.querySelectorAll(
        ".t450, .t-menuburger, .t-menuburger__container, .t-cookies, .t-btnscroll"
      );
      for (var j = 0; j < extras.length; j++) {
        extras[j].style.setProperty("display", "none", "important");
        extras[j].style.setProperty("visibility", "hidden", "important");
      }
      document.documentElement.style.setProperty("overflow", "hidden", "important");
      document.body.style.setProperty("overflow", "hidden", "important");
    }

    hideChrome();
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", hideChrome);
    }
    window.addEventListener("load", hideChrome);
    setTimeout(hideChrome, 300);
    setTimeout(hideChrome, 1200);
  })();
</script>
